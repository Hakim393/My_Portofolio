  <text x="60" y="470" fill="#a1a1aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Facilitating student-recruiter dialogues on technological stacks and software UX standards.</text>
  <rect x="60" y="500" width="160" height="28" rx="4" fill="#3f3f46" />
  <text x="75" y="519" fill="#f4f4f5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">PHOTO 2 / KEYNOTE</text>
