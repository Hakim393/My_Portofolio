<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#18181b" />
  <rect x="20" y="20" width="760" height="560" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
  <!-- Main Keynote Visual -->
  <g transform="translate(60, 60)">
    <rect width="680" height="340" rx="6" fill="#0c4a6e" />
    <rect x="140" y="40" width="400" height="200" rx="8" fill="#0369a1" />
    <text x="340" y="130" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Speaker Panel &amp; Interactive Q&amp;A</text>
    <text x="340" y="160" fill="#bae6fd" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle">Discussion on User-Centric Software Engineering</text>
    <!-- Stage elements -->
    <rect x="200" y="260" width="280" height="40" rx="4" fill="#082f49" />
    <circle cx="250" cy="245" r="14" fill="#f59e0b" />
