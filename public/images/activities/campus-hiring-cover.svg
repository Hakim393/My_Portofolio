<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="chGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#chGrad)" />
  
  <!-- Subtle stage lighting and geometry -->
  <g opacity="0.15">
    <polygon points="600,0 200,800 1000,800" fill="#38bdf8" />
    <circle cx="600" cy="300" r="280" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 8" />
  </g>

  <!-- Banner / Stage Graphic -->
  <g transform="translate(150, 120)">
    <rect width="900" height="560" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    
    <!-- Header banner inside frame -->
    <rect width="900" height="140" rx="16" fill="#09090b" />
    <rect y="120" width="900" height="20" fill="#09090b" />
    <text x="50" y="55" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="2">HIMTI UNIVERSITAS GUNADARMA PRESENTS</text>
    <text x="50" y="95" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800">CAMPUS HIRING</text>
    <text x="50" y="125" fill="#a1a1aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="15">"The Key to Build a Better User Experience"</text>

    <!-- Event Documentation Mockup Visuals -->
    <g transform="translate(50, 170)">
      <!-- Stage & Audience silhouettes -->
      <rect width="480" height="340" rx="8" fill="#121215" stroke="#27272a" stroke-width="1" />
      <!-- Stage screen -->
      <rect x="60" y="40" width="360" height="180" rx="6" fill="#1e293b" />
      <text x="240" y="120" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Speaker Keynote Session</text>
      <text x="240" y="150" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle">Industry Leaders on Product &amp; Engineering UX</text>
      <!-- Podium & Speaker -->
      <rect x="90" y="170" width="30" height="50" fill="#334155" />
      <circle cx="105" cy="155" r="10" fill="#f59e0b" />
      <!-- Audience rows -->
      <g fill="#27272a">
        <circle cx="120" cy="270" r="12" />
        <circle cx="180" cy="270" r="12" />
        <circle cx="240" cy="270" r="12" />
        <circle cx="300" cy="270" r="12" />
        <circle cx="360" cy="270" r="12" />
        <circle cx="150" cy="305" r="14" />
        <circle cx="210" cy="305" r="14" />
        <circle cx="270" cy="305" r="14" />
        <circle cx="330" cy="305" r="14" />
      </g>
      <rect x="0" y="300" width="480" height="40" rx="8" fill="#09090b" fill-opacity="0.8" />
      <text x="20" y="325" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Auditorium Main Hall — HIMTI Campus Hiring</text>
      
      <!-- Right Detail Cards -->
      <g transform="translate(510, 0)">
        <rect width="290" height="100" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <text x="20" y="35" fill="#a1a1aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">ORGANIZATION ROLE</text>
        <text x="20" y="65" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Ketua Divisi Acara</text>
        <text x="20" y="85" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Event Rundown &amp; Coordination Head</text>

        <g transform="translate(0, 120)">
          <rect width="290" height="100" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
          <text x="20" y="35" fill="#a1a1aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">SCOPE OF LEADERSHIP</text>
          <text x="20" y="65" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Event Rundown &amp; Speakers</text>
          <text x="20" y="85" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Cross-divisional management</text>
        </g>

        <g transform="translate(0, 240)">
          <rect width="290" height="100" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
          <text x="20" y="35" fill="#a1a1aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">ORGANIZATION</text>
          <text x="20" y="65" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">HIMTI Univ. Gunadarma</text>
          <text x="20" y="85" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Informatics Student Association</text>
        </g>
      </g>
    </g>
  </g>
</svg>
