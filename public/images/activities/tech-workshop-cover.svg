<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="twGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#twGrad)" />
  <rect x="50" y="50" width="1100" height="700" rx="12" fill="none" stroke="#334155" stroke-width="1.5" />
  
  <g transform="translate(120, 150)">
    <rect width="180" height="32" rx="16" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <text x="24" y="21" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">TECHNICAL WORKSHOP</text>
    <text x="0" y="90" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="800">Backend API Architecture &amp; Database Design</text>
    <text x="0" y="130" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16">Intensive hands-on workshop covering RESTful conventions, Express middleware, and PostgreSQL data models.</text>

    <!-- Visual terminal card -->
    <g transform="translate(0, 170)">
      <rect width="960" height="320" rx="10" fill="#09090b" stroke="#1e293b" stroke-width="1" />
      <rect width="960" height="40" rx="10" fill="#18181b" />
      <circle cx="25" cy="20" r="5" fill="#ef4444" />
      <circle cx="45" cy="20" r="5" fill="#f59e0b" />
      <circle cx="65" cy="20" r="5" fill="#10b981" />
      <text x="100" y="24" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">workshop@gunadarma: ~/backend-lab</text>

      <g transform="translate(30, 80)" font-family="'JetBrains Mono', monospace" font-size="14">
        <text y="0" fill="#38bdf8">$ node --version &amp;&amp; psql --version</text>
        <text y="30" fill="#a1a1aa">v20.12.0 / psql (PostgreSQL) 16.2</text>
        <text y="70" fill="#34d399">✓ Connected to student laboratory database</text>
        <text y="105" fill="#e2e8f0">✓ Executing schema migrations: 0001_create_tables.sql</text>
        <text y="140" fill="#f59e0b">&gt; API testing with Swagger UI and Postman collections completed</text>
        <text y="175" fill="#a1a1aa">Duration: 4 Hours • Attendees: 45 Informatics Engineering Students</text>
      </g>
    </g>
  </g>
