<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="kbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#kbg)" />
  
  <!-- Subtle Blueprint Grid lines -->
  <g opacity="0.1" stroke="#a1a1aa" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="240" y1="0" x2="240" y2="750" />
    <line x1="480" y1="0" x2="480" y2="750" />
    <line x1="720" y1="0" x2="720" y2="750" />
    <line x1="960" y1="0" x2="960" y2="750" />
  </g>

  <!-- Application Window Mockup -->
  <g transform="translate(100, 75)" filter="url(#shadow)">
    <!-- Window Frame -->
    <rect width="1000" height="600" rx="12" fill="#09090b" stroke="#3f3f46" stroke-width="1.5" />
    <!-- Header Bar -->
    <rect width="1000" height="48" rx="12" fill="#18181b" />
    <rect y="36" width="1000" height="12" fill="#18181b" />
    <line x1="0" y1="48" x2="1000" y2="48" stroke="#27272a" stroke-width="1" />
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />
    <!-- Search / URL bar -->
    <rect x="250" y="10" width="500" height="28" rx="6" fill="#27272a" />
    <text x="500" y="28" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">api.kstore-seapedia.internal/v1/orders/checkout</text>

    <!-- App Content Layout: Dashboard & E-commerce System -->
    <!-- Sidebar -->
    <rect x="0" y="48" width="220" height="552" fill="#121215" />
    <text x="24" y="90" fill="#f4f4f5" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">KSTORE / SEAPEDIA</text>
    <text x="24" y="110" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500">E-COMMERCE ENGINE</text>

    <g transform="translate(20, 140)" fill="#a1a1aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">
      <rect x="0" y="0" width="180" height="34" rx="6" fill="#27272a" />
      <text x="36" y="22" fill="#38bdf8" font-weight="600">Overview &amp; APIs</text>
      <text x="36" y="62">Catalog Management</text>
      <text x="36" y="102">Courier &amp; Logistics</text>
      <text x="36" y="142">Order Transactions</text>
      <text x="36" y="182">JWT Auth Sessions</text>
    </g>

    <!-- Main Canvas Area -->
    <!-- Top Stats Row -->
    <g transform="translate(250, 75)">
      <!-- Card 1 -->
      <rect width="220" height="90" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="18" y="30" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">API Endpoints</text>
      <text x="18" y="64" fill="#f4f4f5" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700">28 Active</text>
      
      <!-- Card 2 -->
      <g transform="translate(240, 0)">
        <rect width="220" height="90" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <text x="18" y="30" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Courier Sync</text>
        <text x="18" y="64" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700">Automated</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(480, 0)">
        <rect width="230" height="90" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <text x="18" y="30" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Database Layer</text>
        <text x="18" y="64" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700">PostgreSQL / ORM</text>
      </g>
    </g>

    <!-- Architecture / Code preview box -->
    <g transform="translate(250, 195)">
      <rect width="710" height="370" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <rect width="710" height="36" rx="8" fill="#202024" />
      <rect y="26" width="710" height="10" fill="#202024" />
      <text x="20" y="24" fill="#d4d4d8" font-family="'JetBrains Mono', monospace" font-size="12">POST /v1/checkout - Secure Order Dispatch Architecture</text>
      
      <!-- Code preview snippet -->
      <g transform="translate(24, 60)" font-family="'JetBrains Mono', monospace" font-size="12">
        <text y="0" fill="#c084fc">export const</text> <text x="110" y="0" fill="#60a5fa">processCheckout</text> <text x="250" y="0" fill="#d4d4d8">= async (req, res) =&gt; {</text>
        <text y="26" fill="#a1a1aa">  const { userId, cartItems, shippingCourier } = req.body;</text>
        <text y="52" fill="#a1a1aa">  const transaction = await db.transaction();</text>
        <text y="78" fill="#a1a1aa">  // Validate stock lock and calculate courier rates</text>
        <text y="104" fill="#34d399">  const order = await createOrder({ userId, status: 'PENDING_PAYMENT' });</text>
        <text y="130" fill="#38bdf8">  await dispatchCourierWebhook(shippingCourier, order.id);</text>
        <text y="156" fill="#d4d4d8">  return res.status(201).json({ success: true, orderId: order.id });</text>
        <text y="182" fill="#d4d4d8">};</text>
      </g>

      <!-- Status indicator bar -->
      <g transform="translate(24, 310)">
        <rect width="662" height="36" rx="6" fill="#121215" stroke="#27272a" stroke-width="1" />
        <circle cx="20" cy="18" r="4" fill="#10b981" />
        <text x="36" y="23" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="11">JWT Session Verified • PostgreSQL ACID Compliant • Courier Logistics Integrated</text>
      </g>
    </g>
  </g>
</svg>
