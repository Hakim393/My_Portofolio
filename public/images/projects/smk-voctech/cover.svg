<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="voctechBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="vocShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.38" />
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#voctechBg)" />

  <g opacity="0.08" stroke="#a5b4fc" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Browser Frame -->
  <g transform="translate(100, 75)" filter="url(#vocShadow)">
    <rect width="1000" height="600" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <!-- Header bar -->
    <rect width="1000" height="46" rx="12" fill="#f8fafc" />
    <rect y="34" width="1000" height="12" fill="#f8fafc" />
    <line x1="0" y1="46" x2="1000" y2="46" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="28" cy="23" r="6" fill="#ef4444" />
    <circle cx="48" cy="23" r="6" fill="#f59e0b" />
    <circle cx="68" cy="23" r="6" fill="#10b981" />
    
    <rect x="250" y="9" width="500" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="500" y="27" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">smkvoctech2.sch.id/portal-akademik</text>

    <!-- School Header Bar -->
    <rect x="0" y="46" width="1000" height="64" fill="#312e81" />
    <text x="40" y="85" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700">SMK VOCTECH 2</text>
    <text x="40" y="100" fill="#c7d2fe" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Sistem Informasi Akademik &amp; Profil Sekolah Kejuruan</text>

    <g transform="translate(640, 78)" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#e0e7ff">
      <text x="0" y="0">Beranda</text>
      <text x="75" y="0">Jurusan</text>
      <text x="145" y="0">Pengumuman</text>
      <rect x="240" y="-14" width="80" height="28" rx="4" fill="#4338ca" />
      <text x="254" y="5" fill="#ffffff" font-weight="600">PPDB</text>
    </g>

    <!-- School Portal Body -->
    <g transform="translate(40, 140)">
      <!-- Banner area -->
      <rect width="920" height="150" rx="8" fill="#eef2ff" stroke="#e0e7ff" stroke-width="1" />
      <text x="36" y="50" fill="#312e81" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">Pusat Informasi &amp; Pendaftaran Siswa Baru</text>
      <text x="36" y="80" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">Informasi jurusan Rekayasa Perangkat Lunak, Teknik Komputer Jaringan, dan kegiatan ekstrakurikuler.</text>
      <rect x="36" y="100" width="140" height="32" rx="6" fill="#4f46e5" />
      <text x="56" y="121" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Jadwal Seleksi</text>

      <!-- Grid of school sections -->
      <g transform="translate(0, 175)">
        <rect width="285" height="160" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <rect x="20" y="20" width="36" height="36" rx="6" fill="#6366f1" />
        <text x="20" y="85" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Program Keahlian</text>
        <text x="20" y="110" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Kurikulum vokasi berbasis industri dengan sertifikasi kompetensi.</text>

        <g transform="translate(315, 0)">
          <rect width="285" height="160" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
          <rect x="20" y="20" width="36" height="36" rx="6" fill="#0ea5e9" />
          <text x="20" y="85" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Agenda &amp; Berita</text>
          <text x="20" y="110" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Update pelaksanaan ujian semester dan pameran karya siswa.</text>
        </g>

        <g transform="translate(630, 0)">
          <rect width="285" height="160" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
          <rect x="20" y="20" width="36" height="36" rx="6" fill="#10b981" />
          <text x="20" y="85" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Kontak Sekolah</text>
          <text x="20" y="110" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Layanan informasi akademik dan konsultasi orang tua siswa.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
